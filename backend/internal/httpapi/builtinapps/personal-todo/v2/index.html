<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>个人待办 v2</title>
  <link rel="stylesheet" href="todo.css">
  <script src="todo.js" defer></script>
</head>
<body class="v2">
<main>
  <header><h1>个人待办</h1><span class="version">页面 v2</span></header>
  <p id="connection" role="status">正在连接原生宿主…</p>
  <p id="snapshot" class="muted"></p>
  <p id="notice" class="notice" role="status" hidden></p>
  <div class="actions">
    <button id="refresh" disabled>刷新数据</button>
    <button id="retry" class="primary" hidden>重试提交</button>
    <button id="recover" hidden>处理冲突</button>
  </div>
  <section id="editor" hidden>
    <label id="prompt" for="text">新增待办</label>
    <textarea id="text" rows="2" placeholder="要做什么？"></textarea>
    <p id="count" class="muted"></p>
    <div class="actions">
      <button id="submit" class="primary" disabled>新增</button>
      <button id="close-editor" hidden>取消编辑</button>
    </div>
  </section>
  <section aria-labelledby="items-title">
    <h2 id="items-title">待办清单</h2>
    <p id="empty">正在读取待办…</p>
    <ul id="items"></ul>
  </section>
</main>
</body>
</html>
